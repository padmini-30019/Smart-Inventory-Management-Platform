server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://inventory-service:8080/auth/;
    }

    location /products/ {
        proxy_pass http://inventory-service:8080/products/;
    }

    location /orders/ {
        proxy_pass http://inventory-service:8080/orders/;
    }

    location /inventory/ {
        proxy_pass http://inventory-service:8080/inventory/;
    }

    location /users/ {
        proxy_pass http://inventory-service:8080/users/;
    }

    location /api/ {
        proxy_pass http://inventory-service:8080/api/;
    }
}