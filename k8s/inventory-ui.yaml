apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-ui
  template:
    metadata:
      labels:
        app: inventory-ui
    spec:
      containers:
      - name: inventory-ui
        image: 2420030019/smart-inventory-management:frontend
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-ui-service
spec:
  type: NodePort
  selector:
    app: inventory-ui
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082